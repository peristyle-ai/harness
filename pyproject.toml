[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "peristyle-harness"
version = "0.1.5"
description = "A multi-agent harness for language models: Postgres-backed agent memory, one Flask chat surface, multi-agent via per-schema isolation."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Peristyle" }]
keywords = ["agents", "llm", "flask", "postgres", "pgvector", "memory"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: Flask",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# The runtime dependencies. requirements.txt carries the same list, so a
# `pip install -r requirements.txt` still works; keep the two in step
# (CI checks it -- see .github/workflows/tests.yml).
dependencies = [
    "flask>=3.0,<4",
    "flask-login>=0.6,<0.7",
    "flask-limiter>=3.5,<5",
    "gunicorn>=22,<27",
    "httpx[http2]>=0.27,<0.29",
    "psycopg[binary]>=3.2.10",
    "psycopg-pool>=3.2",
    "pyyaml>=6.0,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<10",
    "pytest-cov>=5.0,<8",
]

[project.urls]
Homepage = "https://github.com/peristyle-ai/harness"
Source = "https://github.com/peristyle-ai/harness"

[project.scripts]
# There is no console entry point yet: the harness is a Flask
# application, run by gunicorn (see run.sh and systemd/harness.service),
# not a CLI. This section will hold the real CLI when there is one --
# do not add a wrapper that only calls create_app().

# ---------------------------------------------------------------------------
# Layout: the package is `app/` at the top of the repo, NOT `src/app/`.
#
# The src/ layout is right for a LIBRARY, where "did I accidentally import
# the source tree instead of the installed package?" is a real question.
# This is an APPLICATION: it is deployed as a checkout, started by
# systemd with a WorkingDirectory, and imported as `app.*` from the
# tests, the scripts and the tools. Moving it under src/ would rename
# the top-level package and touch every import, the unit file, run.sh
# and the CI -- for no benefit.
#
# The consequence of NOT using src/: `pip install -e .` puts the repo
# root on the path, so `import app` resolves to this checkout. That is
# exactly what we want here.
# ---------------------------------------------------------------------------
[tool.setuptools]
packages = ["app", "app.agent", "app.agent.llm", "app.agent.tools", "app.models", "app.routes"]
include-package-data = true

[tool.setuptools.package-data]
app = ["templates/*.html", "static/*", "static/entity-icons/*"]

# ---------------------------------------------------------------------------
# pytest configuration. This replaces the standalone pytest.ini that
# used to hold the same two settings.
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
# Only tests/ holds the test suite. scripts/ holds operational and
# diagnostic scripts -- several of them import at module scope, read
# .env, or talk to a live model, so collecting them is not just
# pointless, it fails the run. `testpaths` applies when pytest is
# invoked with no arguments; `python -m pytest tests/ -q` is
# unaffected.
testpaths = ["tests"]
# Never walk into these.
norecursedirs = [".git", ".venv", "venv", "build", "dist", ".pytest_cache", "logs", "uploads", "harness"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
