<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1a1d23">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="harness">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="harness — group chat for the peristyle multi-agent system">
  <link rel="manifest" href="/static/manifest.json">
  <link rel="icon" href="/static/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/static/icon-180.png">
  <title>{{ group_name }} — harness</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>

<header class="topbar">
  <a href="/" class="icon-btn" aria-label="Back to entities" title="Entities">
    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor"
         stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M15 18l-6-6 6-6"/>
    </svg>
  </a>
  <div class="entity-icon" id="groupIcon" style="--icon-bg: #4f9aff; width: 32px; height: 32px; font-size: 13px;"></div>
  <div class="title" id="groupName">{{ group_name }}</div>
  <div class="typing-indicator" id="typingIndicator" aria-live="polite" aria-label="Agent is typing">
    <span>typing</span>
    <span class="dots" aria-hidden="true">
      <span class="dot"></span><span class="dot"></span><span class="dot"></span>
    </span>
  </div>
  <div class="menu-wrap" id="menuWrap" style="display:none">
    <button class="icon-btn" id="menuBtn" type="button" aria-label="Menu" aria-haspopup="true" aria-expanded="false" title="Menu">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor" aria-hidden="true">
        <circle cx="12" cy="5" r="2"/>
        <circle cx="12" cy="12" r="2"/>
        <circle cx="12" cy="19" r="2"/>
      </svg>
    </button>
    <div class="menu-popover" id="menuPop" style="display:none" role="menu">
      <div class="menu-header" id="menuHeader"></div>
      <a class="menu-item" href="/admin/prompts" target="_blank" rel="noopener" role="menuitem">
        <span class="icon">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="9" y1="13" x2="15" y2="13"/><line x1="9" y1="17" x2="13" y2="17"/>
          </svg>
        </span>
        <span class="label">Prompt files</span>
      </a>
      <div class="menu-divider"></div>
      <button class="menu-item danger" id="menuLogout" type="button" role="menuitem">
        <span class="icon">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/>
          </svg>
        </span>
        <span class="label">Log out</span>
      </button>
    </div>
  </div>
</header>

<main id="main">
  <div id="loginPane" style="display: none;">
    <form class="login-form" id="loginForm" autocomplete="off">
      <h1>harness</h1>
      <p>Sign in to join the group chat.</p>
      <label for="email">Email</label>
      <input type="email" id="email" name="email" required autofocus>
      <label for="password">Password</label>
      <div class="password-field">
        <input type="password" id="password" name="password" required>
        <button type="button" class="password-toggle" id="passwordToggle"
                aria-label="Show password" aria-pressed="false" tabindex="0">
          <svg class="icon-eye" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"
               fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
            <circle cx="12" cy="12" r="3"/>
          </svg>
          <svg class="icon-eye-off" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"
               fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
            <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
            <path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/>
            <line x1="1" y1="1" x2="23" y2="23"/>
          </svg>
        </button>
      </div>
      <div class="login-error" id="loginError" style="display: none;"></div>
      <button type="submit" id="loginBtn">Sign in</button>
    </form>
  </div>

  <div id="chatPane" class="chat">
    <div class="messages" id="messages">
      <div class="empty" id="empty">
        <h2>{{ group_name }}</h2>
        <div>{{ group_description or 'Mention an agent with @name to get it to answer.' }}</div>
      </div>
    </div>
    <!-- Agent roster: tap a name to drop an @mention into the composer. -->
    <div class="mention-bar" id="mentionBar" style="display:none;">
      <span class="mention-bar-label">Mention:</span>
      <div class="mention-chips" id="mentionChips"></div>
    </div>
    <form class="input-bar" id="form" autocomplete="off">
      <textarea id="input" placeholder="Type a message — @agent to ask one" rows="1" autocomplete="off"></textarea>
      <button type="submit" class="send" id="send">Send</button>
    </form>
  </div>
</main>

<script src="/static/marked.min.js"></script>
<script src="/static/purify.min.js"></script>
<script src="/static/group.js" data-group-id="{{ group_id }}"></script>
</body>
</html>
