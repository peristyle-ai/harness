name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: harness
          POSTGRES_PASSWORD: password
          POSTGRES_DB: harness
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:password@localhost:5432/harness
      APP_DB_OPERATOR_ROLE: postgres
      APP_DB_RUNTIME_ROLE: postgres
      PAYROLL_PII_KEY: ci-not-a-real-key
      SECRET_KEY: ci-not-a-real-secret
      HARNESS_SECRET_KEY: ci-not-a-real-secret
      HARNESS_INTERNAL_TOKEN: ci-not-a-real-token

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: install the dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: the schema
        # ONE file creates the whole schema: the shared public tables and
        # the agent's schema. It is idempotent, so it is safe to run once
        # per agent.
        run: |
          set -euo pipefail
          export PGPASSWORD=password
          for agent in peribot peribot; do
            psql -h localhost -U postgres -d harness -v ON_ERROR_STOP=1 \
                 -v "agent_name=$agent" -f schema/init.sql
          done

      - name: the test suite
        run: python -m pytest tests/ -q
