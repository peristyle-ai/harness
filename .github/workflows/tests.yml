name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  secret-scan:
    # GitHub's own secret scanning and push protection need a paid
    # Advanced Security subscription on a PRIVATE repository, and are
    # free once it is public. Until then this job is the enforcement:
    # it fails the build if a secret was committed.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          # The whole history, not a shallow clone: a secret that was
          # committed and then deleted is still in the history, and
          # deleting the file does not un-leak it. GitHub's own secret
          # scanning looks at the same thing.
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: no secret was committed
        run: python scripts/check_no_secrets.py

  public-ref-scan:
    # The working tree is not the whole public repository.  Every branch
    # is a public page, and a branch that was merged and then left
    # behind still publishes the tree it was merged from -- which, for
    # a branch that predates a de-identification sweep, still names the
    # install it was merged from.
    #
    # This job applies the same identifier rules to every branch the
    # remote advertises, so that a stale branch cannot quietly
    # re-publish what the working-tree guard just removed.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          # Every branch, not a shallow clone: the branches ARE what is
          # being scanned.
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: no public branch carries one install's identifiers
        run: python scripts/check_public_refs.py

  identity-scan:
    # The identifier rules read file CONTENT.  The author of a commit is
    # not in any file -- and a commit is a public page: the hosting site
    # prints the author and the committer, indexes them, and keeps them.
    #
    # The work in this repository is done by agents pushing from the
    # installs, and an agent pushes with the git identity of the install
    # it pushes from.  Until this job existed, that identity was a
    # person's mailbox at the operator's own domain, so the next commit
    # after a scrub put the address straight back into the public
    # record.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          # Every commit, not a shallow clone: the author of a commit
          # that is five years old is published just as loudly as the
          # author of the last one.
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: no commit carries an identity that names a person
        run: python scripts/check_commit_identities.py

  pytest:
    runs-on: ubuntu-latest

    services:
      postgres:
        # pgvector's own image, not the vanilla postgres one: schema/init.sql
        # needs CREATE EXTENSION "vector", and the official image does not
        # ship pgvector.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: harness
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:password@localhost:5432/harness
      APP_DB_OPERATOR_ROLE: postgres
      APP_DB_RUNTIME_ROLE: postgres
      PAYROLL_PII_KEY: ci-not-a-real-key
      SECRET_KEY: ci-not-a-real-secret
      HARNESS_SECRET_KEY: ci-not-a-real-secret
      HARNESS_INTERNAL_TOKEN: ci-not-a-real-token

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: install the dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: the dependency lists agree
        # pyproject.toml and requirements.txt carry the same list. Two
        # lists is one too many -- they drift, and then `pip install .`
        # installs something different from `pip install -r
        # requirements.txt`, which is the command the README tells you
        # to run.
        run: |
          python - <<'PY'
          import re, sys, tomllib
          from pathlib import Path

          pyproject = tomllib.loads(Path("pyproject.toml").read_text())
          declared = set(pyproject["project"]["dependencies"])

          def norm(s):
              # compare the package name and the extras, not the version
              s = s.split(";")[0].strip()
              name = re.split(r"[<>=!~\[]", s)[0].strip().lower()
              extras = ""
              m = re.search(r"\[([^\]]*)\]", s)
              if m:
                  extras = "[" + ",".join(sorted(x.strip() for x in m.group(1).split(","))) + "]"
              return name + extras

          declared = {norm(d) for d in declared}

          required = set()
          for line in Path("requirements.txt").read_text().splitlines():
              line = line.strip()
              if line and not line.startswith("#"):
                  required.add(norm(line))

          missing = required - declared
          extra = declared - required
          if missing or extra:
              print("pyproject.toml and requirements.txt disagree")
              for d in sorted(missing):
                  print("  in requirements.txt but not in pyproject.toml:", d)
              for d in sorted(extra):
                  print("  in pyproject.toml but not in requirements.txt:", d)
              sys.exit(1)
          print("dependency lists agree:", len(declared), "packages")
          PY

      - name: the schema
        # ONE file creates the whole schema: the shared public tables and
        # the agent's schema. It is idempotent, so it is safe to run once
        # per agent.
        run: |
          set -euo pipefail
          export PGPASSWORD=password
          # The agent names come from config.yaml.example -- the SAME file
          # the template ships -- so the CI never names an agent the
          # template does not. (It used to hard-code this project's own
          # agent names, which nobody else's install has.)
          for agent in $(python3 -c "import yaml; print(' '.join(yaml.safe_load(open('config.yaml.example'))['app']['agents']))"); do
            psql -h localhost -U postgres -d harness -v ON_ERROR_STOP=1 \
                 -v "agent_name=$agent" -f schema/init.sql
          done

      - name: the test suite
        run: python -m pytest tests/ -q
